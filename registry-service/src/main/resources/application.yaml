spring:
  application:
    name: registry-service
server:
  port: 8184

management:
  endpoints:
    web:
      exposure:
        include: "*"
        exclude: beans
  endpoint:
    health:
      show-details: always
      env:
        show-values: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    uu.app: debug
  file:
    name: logs/registry-service.log
  pattern:
    level: "%5p [traceId=%X{traceId}, spanId=%X{spanId}]"

service:
  schedule:
    cleanup:
      delay-ms: 30000
      initial-delay-ms: 15000
    availability:
      delay-ms: 30000
  cleanup:
    delete-threshold-ms: 60000
    cancel-threshold-ms: 30000