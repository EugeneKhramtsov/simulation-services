spring:
  application:
    name: client-service
  profiles:
    #active: static
    active: dynamic
  task:
    execution:
      pool:
        size: 10
server:
  port: 9121

management:
  endpoints:
    web:
      exposure:
        include: prometheus, health, info
        exclude: beans
  endpoint:
    health:
      show-details: always
      env:
        show-values: when_authorized
  metrics:
    export:
      prometheus:
        enabled: true
  tracing:
    sampling:
      probability: 1.0

logging:
  level:
    uu.app: debug
  file:
    name: logs/client-service.log
  pattern:
    level: "%5p [traceId=%X{traceId}, spanId=%X{spanId}]"

service:
  connection:
    processing-service:
      name: processing-service
      host: localhost
      port: 9132
  ip-address:

registry-service:
  url: "http://localhost:9111"
  discovery:
    enabled: true